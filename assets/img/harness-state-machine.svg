<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
<rect width="720" height="430" rx="10" fill="#0e0f12"/>
<defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8b909a"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f0a03c"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ff7847"/></marker></defs>
<text x="24" y="36" fill="#d9dce1" font-size="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-weight="600">Harness execution state machine</text>
<text x="24" y="56" fill="#8b909a" font-size="11.5">every transition is data: stored, replayable, auditable</text>
<rect x="30" y="96" width="128" height="52" rx="8" fill="#16181d" stroke="#26292f" stroke-width="1"/>
<text x="94.0" y="119.0" fill="#d9dce1" font-size="13" text-anchor="middle">PLAN</text>
<text x="94.0" y="137.0" fill="#8b909a" font-size="10" text-anchor="middle">pick next step</text>
<rect x="208" y="96" width="128" height="52" rx="8" fill="#16181d" stroke="#26292f" stroke-width="1"/>
<text x="272.0" y="119.0" fill="#d9dce1" font-size="13" text-anchor="middle">ACT</text>
<text x="272.0" y="137.0" fill="#8b909a" font-size="10" text-anchor="middle">one tool call</text>
<rect x="386" y="96" width="128" height="52" rx="8" fill="#16181d" stroke="#f0a03c" stroke-width="1.5"/>
<text x="450.0" y="119.0" fill="#d9dce1" font-size="13" text-anchor="middle">VERIFY</text>
<text x="450.0" y="137.0" fill="#8b909a" font-size="10" text-anchor="middle">first-class state</text>
<rect x="564" y="96" width="128" height="52" rx="8" fill="#16181d" stroke="#26292f" stroke-width="1"/>
<text x="628.0" y="119.0" fill="#d9dce1" font-size="13" text-anchor="middle">CHECKPOINT</text>
<text x="628.0" y="137.0" fill="#8b909a" font-size="10" text-anchor="middle">known-good state</text>
<rect x="300" y="300" width="128" height="52" rx="8" fill="#16181d" stroke="#f0a03c" stroke-width="1.5"/>
<text x="364.0" y="323.0" fill="#d9dce1" font-size="13" text-anchor="middle">HUMAN</text>
<text x="364.0" y="341.0" fill="#8b909a" font-size="10" text-anchor="middle">outer loop</text>
<rect x="30" y="300" width="128" height="52" rx="8" fill="#16181d" stroke="#26292f" stroke-width="1"/>
<text x="94.0" y="323.0" fill="#d9dce1" font-size="13" text-anchor="middle">FAILED</text>
<text x="94.0" y="341.0" fill="#8b909a" font-size="10" text-anchor="middle">with full trace</text>
<rect x="564" y="300" width="128" height="52" rx="8" fill="#16181d" stroke="#26292f" stroke-width="1"/>
<text x="628.0" y="323.0" fill="#d9dce1" font-size="13" text-anchor="middle">DONE</text>
<text x="628.0" y="341.0" fill="#8b909a" font-size="10" text-anchor="middle">goal verified</text>
<path d="M 158 122 L 204 122" fill="none" stroke="#8b909a" stroke-width="1.5" marker-end="url(#am)"/>
<text x="183.0" y="114" fill="#8b909a" font-size="10.5" text-anchor="middle">tool call</text>
<path d="M 336 122 L 382 122" fill="none" stroke="#8b909a" stroke-width="1.5" marker-end="url(#am)"/>
<text x="361.0" y="114" fill="#8b909a" font-size="10.5" text-anchor="middle">result</text>
<path d="M 514 122 L 560 122" fill="none" stroke="#f0a03c" stroke-width="1.5" marker-end="url(#aa)"/>
<text x="539.0" y="114" fill="#f0a03c" font-size="10.5" text-anchor="middle">pass</text>
<path d="M 628.0 92 Q 361.0 50 94.0 92" fill="none" stroke="#8b909a" stroke-width="1.5" marker-end="url(#am)"/>
<text x="492" y="80" fill="#8b909a" font-size="10.5" text-anchor="middle">more steps</text>
<path d="M 660.0 148 L 660.0 296" fill="none" stroke="#8b909a" stroke-width="1.5" marker-end="url(#am)"/>
<text x="650.0" y="224.0" fill="#8b909a" font-size="10.5" text-anchor="end">goal met</text>
<path d="M 416 152 Q 208.0 206 138 152" fill="none" stroke="#ff7847" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ae)"/>
<text x="168.0" y="212" fill="#ff7847" font-size="10.5" text-anchor="middle">fail · retry &lt; budget</text>
<path d="M 450.0 148 L 394.0 296" fill="none" stroke="#ff7847" stroke-width="1.5" marker-end="url(#ae)"/>
<text x="415.0" y="236.0" fill="#ff7847" font-size="10.5" text-anchor="start">fail · budget spent</text>
<path d="M 320 300 L 114.0 152" fill="none" stroke="#f0a03c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#aa)"/>
<text x="157.0" y="250.0" fill="#f0a03c" font-size="10.5" text-anchor="middle">steer · resume</text>
<path d="M 296 326 L 162 326" fill="none" stroke="#8b909a" stroke-width="1.5" marker-end="url(#am)"/>
<text x="229.0" y="318" fill="#8b909a" font-size="10.5" text-anchor="middle">abort</text>
</svg>
