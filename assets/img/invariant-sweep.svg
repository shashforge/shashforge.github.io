<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
<rect width="760" height="430" rx="10" fill="#0e0f12"/>
<text x="24" y="36" fill="#d9dce1" font-size="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-weight="600">Nobody chose these tests</text>
<text x="24" y="56" fill="#8b909a" font-size="11.5">250 seeded worlds; the invariants must hold in every one of them</text>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8b909a"/></marker></defs>
<text x="36" y="92" fill="#f0a03c" font-size="12">random.Random(seed)</text>
<rect x="36" y="104" width="220" height="48" rx="8" fill="#16181d" stroke="#26292f"/>
<text x="48" y="124" fill="#d9dce1" font-size="10.5">tools that flake, refuse,</text>
<text x="48" y="140" fill="#8b909a" font-size="10">or reject their own work</text>
<rect x="36" y="162" width="220" height="48" rx="8" fill="#16181d" stroke="#26292f"/>
<text x="48" y="182" fill="#d9dce1" font-size="10.5">some demand scopes</text>
<text x="48" y="198" fill="#8b909a" font-size="10">the run was never granted</text>
<rect x="36" y="220" width="220" height="48" rx="8" fill="#16181d" stroke="#26292f"/>
<text x="48" y="240" fill="#d9dce1" font-size="10.5">planner with a random goal</text>
<text x="48" y="256" fill="#8b909a" font-size="10">verifier is a weighted coin</text>
<rect x="36" y="278" width="220" height="48" rx="8" fill="#16181d" stroke="#26292f"/>
<text x="48" y="298" fill="#d9dce1" font-size="10.5">a human with finite patience</text>
<text x="48" y="314" fill="#8b909a" font-size="10">0–3 resumes, then abort</text>
<path d="M 256 200 L 296 200" fill="none" stroke="#8b909a" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="300" y="170" width="130" height="60" rx="8" fill="#16181d" stroke="#f0a03c" stroke-width="1.2"/>
<text x="365" y="196" fill="#d9dce1" font-size="11.5" text-anchor="middle">Executor</text>
<text x="365" y="214" fill="#8b909a" font-size="10" text-anchor="middle">store attached</text>
<path d="M 430 200 L 470 200" fill="none" stroke="#8b909a" stroke-width="1.5" marker-end="url(#m)"/>
<text x="474" y="92" fill="#f0a03c" font-size="12">must hold, every seed:</text>
<rect x="474" y="104" width="250" height="36" rx="8" fill="#16181d" stroke="#26292f"/>
<text x="488" y="127" fill="#d9dce1" font-size="10.5">ends in DONE or FAILED, always</text>
<rect x="474" y="150" width="250" height="36" rx="8" fill="#16181d" stroke="#26292f"/>
<text x="488" y="173" fill="#d9dce1" font-size="10.5">trace gapless, strictly increasing</text>
<rect x="474" y="196" width="250" height="36" rx="8" fill="#16181d" stroke="#26292f"/>
<text x="488" y="219" fill="#d9dce1" font-size="10.5">checkpoint ⇔ verified, one for one</text>
<rect x="474" y="242" width="250" height="36" rx="8" fill="#16181d" stroke="#26292f"/>
<text x="488" y="265" fill="#d9dce1" font-size="10.5">no tool billed past its budget</text>
<rect x="474" y="300" width="250" height="40" rx="8" fill="#16181d" stroke="#3fb970" stroke-width="1.2"/>
<text x="488" y="318" fill="#d9dce1" font-size="10.5">replay() re-derives the run</text>
<text x="488" y="333" fill="#3fb970" font-size="10">agrees 250 / 250</text>
<text x="36" y="400" fill="#8b909a" font-size="10.5">stdlib random only &#183; same seed, same trace &#183; 288 collected tests in half a second</text>
</svg>
