<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
<rect width="760" height="380" rx="10" fill="#0e0f12"/>
<text x="24" y="36" fill="#d9dce1" font-size="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-weight="600">The trace tells it back</text>
<text x="24" y="56" fill="#8b909a" font-size="11.5">the store is the evidence; the inspector only arranges it for reading</text>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8b909a"/></marker></defs>
<rect x="36" y="140" width="170" height="64" rx="8" fill="#16181d" stroke="#26292f"/>
<text x="121" y="166" fill="#d9dce1" font-size="11.5" text-anchor="middle">out/run.jsonl</text>
<text x="121" y="184" fill="#8b909a" font-size="10" text-anchor="middle">append-only store</text>
<path d="M 206 172 L 246 172" fill="none" stroke="#8b909a" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="250" y="128" width="210" height="88" rx="8" fill="#16181d" stroke="#f0a03c" stroke-width="1.2"/>
<text x="355" y="154" fill="#d9dce1" font-size="11" text-anchor="middle">agent_harness.inspect</text>
<text x="355" y="174" fill="#8b909a" font-size="10" text-anchor="middle">imports the store and replay(),</text>
<text x="355" y="190" fill="#8b909a" font-size="10" text-anchor="middle">nothing that can execute</text>
<path d="M 460 172 L 500 172" fill="none" stroke="#8b909a" stroke-width="1.5" marker-end="url(#m)"/>
<rect x="504" y="92" width="220" height="140" rx="8" fill="#16181d" stroke="#26292f"/>
<text x="518" y="114" fill="#d9dce1" font-size="10.5">timeline, every transition</text>
<text x="518" y="136" fill="#f0a03c" font-size="10.5">act &#8594; act        retry</text>
<text x="518" y="156" fill="#ff7847" font-size="10.5">act &#8594; escalate   escalation</text>
<text x="518" y="176" fill="#3fb970" font-size="10.5">verify &#8594; checkpoint</text>
<text x="518" y="200" fill="#8b909a" font-size="10">marks decided by state pair,</text>
<text x="518" y="216" fill="#8b909a" font-size="10">not by matching reason strings</text>
<rect x="252" y="266" width="230" height="40" rx="8" fill="#16181d" stroke="#3fb970" stroke-width="1.2"/>
<text x="266" y="284" fill="#d9dce1" font-size="10.5">replay: clean</text>
<text x="266" y="299" fill="#3fb970" font-size="10">exit 0 &#183; every checkpoint verified</text>
<rect x="494" y="266" width="230" height="40" rx="8" fill="#16181d" stroke="#ff7847" stroke-width="1.2"/>
<text x="508" y="284" fill="#d9dce1" font-size="10.5">CORRUPT TRACE</text>
<text x="508" y="299" fill="#ff7847" font-size="10">exit 2 &#183; the violation, named</text>
<path d="M 355 216 L 355 262" fill="none" stroke="#8b909a" stroke-width="1.5" marker-end="url(#m)"/>
<text x="36" y="350" fill="#8b909a" font-size="10.5">the verdict is not the inspector's opinion: it is the same replay() the test suite trusts</text>
</svg>
