<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
<rect width="760" height="400" rx="10" fill="#0e0f12"/>
<text x="24" y="36" fill="#d9dce1" font-size="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-weight="600">The KV cache, before and after paging</text>
<text x="24" y="56" fill="#8b909a" font-size="11.5">Kwon et al., SOSP 2023: serving bills like a memory problem</text>
<defs><pattern id="h" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#16181d"/><line x1="0" y1="0" x2="0" y2="6" stroke="#ff7847" stroke-width="1.6" opacity="0.55"/></pattern><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8b909a"/></marker></defs>
<text x="36" y="96" fill="#f0a03c" font-size="12">contiguous, per request</text>
<rect x="36" y="108" width="80" height="30" fill="#16181d" stroke="#3fb970" stroke-width="1"/>
<rect x="116" y="108" width="110" height="30" fill="url(#h)" stroke="#26292f"/>
<rect x="226" y="108" width="90" height="30" fill="url(#h)" stroke="#26292f"/>
<text x="76" y="127" fill="#3fb970" font-size="9.5" text-anchor="middle">tokens</text>
<text x="171" y="127" fill="#ff7847" font-size="9.5" text-anchor="middle">reserved</text>
<text x="271" y="127" fill="#ff7847" font-size="9.5" text-anchor="middle">internal frag</text>
<rect x="36" y="146" width="60" height="30" fill="#16181d" stroke="#3fb970" stroke-width="1"/>
<rect x="96" y="146" width="130" height="30" fill="url(#h)" stroke="#26292f"/>
<text x="66" y="165" fill="#3fb970" font-size="9.5" text-anchor="middle">tokens</text>
<text x="161" y="165" fill="#ff7847" font-size="9.5" text-anchor="middle">reserved to max length</text>
<rect x="240" y="146" width="76" height="30" fill="url(#h)" stroke="#26292f"/>
<text x="278" y="165" fill="#ff7847" font-size="9.5" text-anchor="middle">external</text>
<text x="36" y="204" fill="#ff7847" font-size="11">61.8&#8211;79.6% of KV memory wasted, measured</text>
<text x="36" y="222" fill="#8b909a" font-size="10">only 20.4&#8211;38.2% held actual token state</text>
<text x="420" y="96" fill="#f0a03c" font-size="12">paged, blocks of 16 tokens</text>
<rect x="420" y="108" width="96" height="68" rx="8" fill="#16181d" stroke="#26292f"/>
<text x="468" y="130" fill="#d9dce1" font-size="10" text-anchor="middle">block table</text>
<text x="468" y="146" fill="#8b909a" font-size="9.5" text-anchor="middle">logical &#8594;</text>
<text x="468" y="160" fill="#8b909a" font-size="9.5" text-anchor="middle">physical</text>
<rect x="556" y="108" width="38" height="28" rx="4" fill="#16181d" stroke="#3fb970" stroke-width="1"/>
<rect x="600" y="108" width="38" height="28" rx="4" fill="#16181d" stroke="#3fb970" stroke-width="1"/>
<rect x="644" y="108" width="38" height="28" rx="4" fill="#16181d" stroke="#3fb970" stroke-width="1"/>
<rect x="688" y="108" width="38" height="28" rx="4" fill="#16181d" stroke="#3fb970" stroke-width="1"/>
<rect x="556" y="142" width="38" height="28" rx="4" fill="#16181d" stroke="#3fb970" stroke-width="1"/>
<rect x="600" y="142" width="38" height="28" rx="4" fill="#16181d" stroke="#3fb970" stroke-width="1"/>
<rect x="644" y="142" width="38" height="28" rx="4" fill="#16181d" stroke="#26292f" stroke-width="1"/>
<rect x="688" y="142" width="38" height="28" rx="4" fill="#16181d" stroke="#3fb970" stroke-width="1"/>
<path d="M 516 142 L 550 142" fill="none" stroke="#8b909a" stroke-width="1.5" marker-end="url(#m)"/>
<text x="420" y="204" fill="#3fb970" font-size="11">near-zero waste; allocate on demand</text>
<text x="420" y="222" fill="#8b909a" font-size="10">shared prefixes, copy-on-write on divergence</text>
<rect x="36" y="252" width="688" height="56" rx="8" fill="#16181d" stroke="#26292f"/>
<text x="52" y="275" fill="#d9dce1" font-size="10.5">OPT-13B: 800 KB of KV cache per token &#183; 2&#215;5120&#215;40 layers&#215;2 bytes &#183; a 2,000-token chat drags 1.6 GB</text>
<text x="52" y="295" fill="#8b909a" font-size="10.5">price of indirection: 20&#8211;26% on the attention kernel &#183; return: 2&#8211;4&#215; throughput at equal latency</text>
<text x="36" y="348" fill="#8b909a" font-size="10.5">the fix is virtual memory, applied without embarrassment &#183; what changed is where the cost lives</text>
</svg>
